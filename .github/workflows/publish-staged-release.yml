name: Publish staged release

on:
  push:
    branches:
      - "release-sync-v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out staged assets
        uses: actions/checkout@v4

      - name: Validate version and checksums
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#release-sync-}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          test -s RELEASE_NOTES.md
          test -s payload/SHA256SUMS
          (
            cd payload
            sha256sum -c SHA256SUMS
            sha256sum -c -- ./*.sha256
          )

          printf 'RELEASE_VERSION=%s\n' "${version}" >> "${GITHUB_ENV}"

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_VERSION}" \
              --title "Linker Dashboard ${RELEASE_VERSION}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_VERSION}" \
              --verify-tag \
              --title "Linker Dashboard ${RELEASE_VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi

          mapfile -t assets < <(find payload -maxdepth 1 -type f -print | sort)
          gh release upload "${RELEASE_VERSION}" "${assets[@]}" --clobber
